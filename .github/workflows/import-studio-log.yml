name: Import DAKO Studio Log

on:
  push:
    paths:
      - ".github/workflows/import-studio-log.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Studio Log
        run: |
          mkdir -p public
          curl --fail --location --retry 3 "https://at.adobe.com/XpqN2ZR2Cy4rVZKd" -o public/studio-log.html
          test "$(wc -c < public/studio-log.html)" -gt 30000
          grep -q "DAKO Tattoo" public/studio-log.html

      - name: Commit Studio Log
        run: |
          git config user.name "dako-studio-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/studio-log.html
          if ! git diff --cached --quiet; then
            git commit -m "Add simplified DAKO Studio Log"
            git push
          fi
